# Publishes this repository on GitHub Pages after every push to main, with version.json
# added: the commit's SHA and the time of this build. The repository holds only web builds
# of Świat Sióstr 3D, pushed by Tools/deploy-web.sh in the game's source repository.
# Its Pages source must be set to "GitHub Actions" (Settings > Pages).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload and deploy are separate jobs: deploy-pages run in the same job as the upload
  # sometimes finds no artifact yet (actions/deploy-pages "No artifacts named github-pages").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write version.json
        run: echo "{\"sha\":\"${GITHUB_SHA}\",\"date\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > version.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
